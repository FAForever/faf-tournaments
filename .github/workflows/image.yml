# Every push to main builds the image FAF's cluster runs and publishes it to
# Docker Hub as `faforever/faf-tournaments:latest`, where FAF keeps all its
# images. The cluster picks up a new `latest` on its own within a couple of
# minutes (Keel, see apps/faf-tournaments in FAForever/gitops-stack), so pushing
# to main is the whole release: no tag, no PR anywhere else.
#
# Each image is also tagged with its commit, so a bad release is undone by
# pointing `latest` back at the previous commit's image.
name: Image

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Blocks the release: a file that does not parse would not start.
      - run: npm run check
      # Reported, not blocking yet: the tree has type errors from before this
      # check existed, and a red build here would stop every deploy.
      - run: npm run typecheck
        continue-on-error: true

  image:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # DOCKER_USERNAME and DOCKER_PASSWORD are the FAForever organization's
      # Docker Hub credentials, the same ones faf-qai and faf-league-service use.
      - name: Build and publish
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          image="faforever/faf-tournaments"
          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
          docker build -t "$image:latest" -t "$image:${GITHUB_SHA::12}" .
          docker push "$image:${GITHUB_SHA::12}"
          docker push "$image:latest"
